<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="timelineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Title -->
  <rect x="60" y="32" width="8" height="36" rx="4" fill="#3B82F6"/>
  <text x="80" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1F2937">完整交易闭环流程</text>
  <text x="80" y="84" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#6B7280">FROM BROWSE TO REVIEW — 7 STEPS</text>

  <!-- Center timeline line -->
  <line x1="640" y1="110" x2="640" y2="620" stroke="url(#timelineGrad)" stroke-width="3"/>

  <!-- Node 1 -->
  <circle cx="640" cy="130" r="14" fill="#3B82F6"/>
  <text x="640" y="135" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
  <rect x="60" y="110" width="480" height="50" rx="8" fill="#EFF6FF"/>
  <text x="80" y="138" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E40AF">买家点击"我想要"</text>
  <text x="80" y="152" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">跳转至IM聊天界面，自动发送商品卡片</text>
  <text x="700" y="138" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#9CA3AF">Day 0</text>

  <!-- Node 2 -->
  <circle cx="640" cy="210" r="14" fill="#3B82F6"/>
  <text x="640" y="215" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
  <rect x="700" y="190" width="480" height="50" rx="8" fill="#F9FAFB"/>
  <text x="720" y="218" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">双方沟通协商</text>
  <text x="720" y="232" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">最终价格确认，面交时间地点协定</text>
  <text x="80" y="218" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#9CA3AF">Day 0-1</text>

  <!-- Node 3 - Key node -->
  <circle cx="640" cy="290" r="16" fill="#F59E0B"/>
  <text x="640" y="296" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
  <rect x="60" y="266" width="480" height="56" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="80" y="294" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#B45309">创建订单</text>
  <text x="80" y="312" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#92400E">Redis分布式锁 · 72小时计时开始</text>
  <text x="700" y="294" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#9CA3AF">Day 1</text>

  <!-- Node 4 -->
  <circle cx="640" cy="370" r="14" fill="#10B981"/>
  <text x="640" y="375" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
  <rect x="700" y="350" width="480" height="50" rx="8" fill="#ECFDF5"/>
  <text x="720" y="378" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#065F46">卖家确认接单</text>
  <text x="720" y="392" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">状态变更：待接单→待面交</text>
  <text x="80" y="378" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#9CA3AF">Day 1</text>

  <!-- Node 5 - Core innovation -->
  <circle cx="640" cy="450" r="16" fill="#F59E0B"/>
  <text x="640" y="456" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
  <rect x="60" y="426" width="480" height="56" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="80" y="454" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#B45309">双向确认面交</text>
  <text x="80" y="472" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#92400E">卖家确认+买家确认→自动完成，核心创新点</text>
  <text x="700" y="454" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#9CA3AF">Day 2</text>

  <!-- Node 6 -->
  <circle cx="640" cy="530" r="14" fill="#8B5CF6"/>
  <text x="640" y="535" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">6</text>
  <rect x="700" y="510" width="480" height="50" rx="8" fill="#F5F3FF"/>
  <text x="720" y="538" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6D28D9">交易后互评</text>
  <text x="720" y="552" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">7天窗口，三维度评分（描述/态度/体验）</text>
  <text x="80" y="538" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#9CA3AF">Day 2-9</text>

  <!-- Node 7 -->
  <circle cx="640" cy="610" r="14" fill="#10B981"/>
  <text x="640" y="615" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">7</text>
  <rect x="60" y="590" width="480" height="40" rx="8" fill="#ECFDF5"/>
  <text x="80" y="615" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#065F46">流程结束 — 用户信誉分更新</text>
  <text x="700" y="615" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#9CA3AF">Day 9 完成</text>

  <!-- Bottom stats -->
  <rect x="60" y="660" width="1160" height="40" rx="8" fill="#F9FAFB"/>
  <text x="200" y="686" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#1F2937">平均周期 <tspan font-weight="bold" fill="#3B82F6">3.5天</tspan></text>
  <text x="480" y="686" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#1F2937">完成率 <tspan font-weight="bold" fill="#10B981">87.3%</tspan></text>
  <text x="740" y="686" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#1F2937">好评率 <tspan font-weight="bold" fill="#F59E0B">92.1%</tspan></text>
  <text x="1020" y="686" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#1F2937">重复交易率 <tspan font-weight="bold" fill="#8B5CF6">34.6%</tspan></text>
</svg>
