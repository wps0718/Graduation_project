<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#EFF6FF"/>
  <rect x="60" y="32" width="8" height="36" rx="4" fill="#3B82F6"/>
  <text x="80" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1F2937">7大自动化定时任务</text>
  <text x="80" y="84" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#6B7280">SCHEDULED TASKS — 24/7 RUNNING · 今日执行328次</text>

  <!-- Task cards grid -->
  <!-- Task 1: 订单超时 -->
  <rect x="60" y="110" width="370" height="180" rx="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2"/>
  <use data-icon="tabler-filled/clock" x="80" y="130" width="28" height="28" fill="#EF4444"/>
  <text x="116" y="150" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#DC2626">订单超时取消</text>
  <rect x="320" y="128" width="90" height="24" rx="12" fill="#FEF2F2"/>
  <text x="365" y="145" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#EF4444">每5分钟</text>
  <text x="80" y="178" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">72小时未面交自动取消</text>
  <text x="80" y="200" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">status→5(已取消) · 通知双方</text>
  <text x="80" y="222" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">商品恢复在售状态</text>
  <rect x="80" y="248" width="140" height="26" rx="13" fill="#FEF2F2"/>
  <text x="150" y="266" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#EF4444">今日: 58次 / 120ms</text>

  <!-- Task 2: 自动确认 -->
  <rect x="455" y="110" width="370" height="180" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <use data-icon="tabler-filled/clipboard-check" x="475" y="130" width="28" height="28" fill="#3B82F6"/>
  <text x="511" y="150" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563EB">订单自动确认</text>
  <rect x="715" y="128" width="90" height="24" rx="12" fill="#EFF6FF"/>
  <text x="760" y="145" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#3B82F6">凌晨 2:00</text>
  <text x="475" y="178" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">创建后7天未确认自动完成</text>
  <text x="475" y="200" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">status→3(已完成) · 保障卖家权益</text>
  <text x="475" y="222" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">商品状态→已售出</text>
  <rect x="475" y="248" width="140" height="26" rx="13" fill="#EFF6FF"/>
  <text x="545" y="266" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#3B82F6">昨日: 12个 / 350ms</text>

  <!-- Task 3: 自动好评 -->
  <rect x="850" y="110" width="370" height="180" rx="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
  <use data-icon="tabler-filled/star" x="870" y="130" width="28" height="28" fill="#8B5CF6"/>
  <text x="906" y="150" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6D28D9">自动好评</text>
  <rect x="1110" y="128" width="90" height="24" rx="12" fill="#F5F3FF"/>
  <text x="1155" y="145" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#8B5CF6">凌晨 3:00</text>
  <text x="870" y="178" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">交易完成7天未评价默认好评</text>
  <text x="870" y="200" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">三维5分 · is_auto=1</text>
  <text x="870" y="222" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">重新计算综合评分</text>
  <rect x="870" y="248" width="140" height="26" rx="13" fill="#F5F3FF"/>
  <text x="940" y="266" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B5CF6">昨日: 8条 / 200ms</text>

  <!-- Task 4: 评价提醒 -->
  <rect x="60" y="310" width="370" height="170" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <use data-icon="tabler-filled/bell" x="80" y="330" width="28" height="28" fill="#F59E0B"/>
  <text x="116" y="350" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#B45309">评价提醒</text>
  <rect x="320" y="328" width="90" height="24" rx="12" fill="#FFFBEB"/>
  <text x="365" y="345" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#F59E0B">上午 10:00</text>
  <text x="80" y="378" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">完成第3天仍未评价 → 提醒</text>
  <text x="80" y="400" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">每笔订单仅提醒1次</text>
  <text x="80" y="422" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">站内通知推送</text>
  <rect x="80" y="444" width="140" height="26" rx="13" fill="#FFFBEB"/>
  <text x="150" y="462" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#F59E0B">昨日: 15条 / 180ms</text>

  <!-- Task 5: 商品下架 -->
  <rect x="455" y="310" width="370" height="170" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <use data-icon="tabler-filled/clipboard-list" x="475" y="330" width="28" height="28" fill="#10B981"/>
  <text x="511" y="350" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#065F46">商品自动下架</text>
  <rect x="715" y="328" width="90" height="24" rx="12" fill="#ECFDF5"/>
  <text x="760" y="345" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#10B981">凌晨 4:00</text>
  <text x="475" y="378" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">发布后90天自动下架</text>
  <text x="475" y="400" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">保持商品信息时效性</text>
  <text x="475" y="422" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">卖家可重新上架</text>
  <rect x="475" y="444" width="140" height="26" rx="13" fill="#ECFDF5"/>
  <text x="545" y="462" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#10B981">昨日: 5个 / 150ms</text>

  <!-- Task 6: 账号清理 -->
  <rect x="850" y="310" width="370" height="170" rx="12" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <use data-icon="tabler-filled/users" x="870" y="330" width="28" height="28" fill="#6B7280"/>
  <text x="906" y="350" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#4B5563">注销账号清理</text>
  <rect x="1110" y="328" width="90" height="24" rx="12" fill="#F3F4F6"/>
  <text x="1155" y="345" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#6B7280">凌晨 5:00</text>
  <text x="870" y="378" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">申请注销后30天数据清理</text>
  <text x="870" y="400" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">保留历史数据完整性</text>
  <text x="870" y="422" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">30天内可恢复</text>
  <rect x="870" y="444" width="140" height="26" rx="13" fill="#F3F4F6"/>
  <text x="940" y="462" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">昨日: 2个 / 100ms</text>

  <!-- Task 7: WebSocket心跳 -->
  <rect x="60" y="510" width="1160" height="70" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <use data-icon="tabler-filled/bolt" x="80" y="528" width="28" height="28" fill="#10B981"/>
  <text x="116" y="548" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#065F46">WebSocket心跳检测</text>
  <rect x="320" y="526" width="90" height="24" rx="12" fill="#ECFDF5"/>
  <text x="365" y="543" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#10B981">每30秒</text>
  <text x="440" y="548" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">心跳TTL 60秒 · 超时强制断开 · 清理SessionManager</text>
  <text x="440" y="570" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#6B7280">当前在线: 328人 · 平均延迟: 42ms</text>

  <!-- Bottom stats -->
  <rect x="60" y="610" width="1160" height="90" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="340" y="642" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#1F2937">7个任务全部运行中</text>
  <text x="340" y="670" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#6B7280">可通过 application.yml 独立开关控制</text>
  <text x="640" y="642" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#1F2937">今日总执行 <tspan font-weight="bold" fill="#3B82F6">328</tspan> 次</text>
  <text x="640" y="670" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#6B7280">平均耗时 156ms</text>
  <text x="940" y="642" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#1F2937">任务成功率 <tspan font-weight="bold" fill="#10B981">99.7%</tspan></text>
  <text x="940" y="670" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#6B7280">失败重试: 1次</text>
</svg>
