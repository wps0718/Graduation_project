<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Title -->
  <rect x="60" y="32" width="8" height="36" rx="4" fill="#3B82F6"/>
  <text x="80" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1F2937">管理端功能与数据概览</text>
  <text x="80" y="84" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#6B7280">ADMIN PANEL FEATURES &amp; DATA DASHBOARD</text>

  <!-- Left 40%: Admin modules -->
  <!-- Module 1: 审核 -->
  <rect x="60" y="110" width="460" height="170" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="60" y="110" width="4" height="170" rx="2" fill="#EF4444"/>
  <text x="84" y="138" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="bold" fill="#DC2626">审核模块</text>
  <text x="84" y="168" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#4B5563">商品审核 — 通过/驳回/强制下架</text>
  <text x="84" y="194" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#4B5563">认证审核 — 历史时间线/多版本对比</text>
  <text x="84" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#4B5563">举报处理 — 6类举报原因分类</text>
  <rect x="84" y="240" width="100" height="26" rx="13" fill="#FEF2F2"/>
  <text x="134" y="258" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#EF4444">待审核: 23</text>

  <!-- Module 2: 管理 -->
  <rect x="60" y="300" width="460" height="140" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="60" y="300" width="4" height="140" rx="2" fill="#3B82F6"/>
  <text x="84" y="328" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2563EB">管理模块</text>
  <text x="84" y="358" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#4B5563">用户管理 — 封禁/解封/详情查看</text>
  <text x="84" y="384" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#4B5563">订单管理 — 列表/详情/关联查询</text>
  <text x="84" y="410" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#4B5563">订单详情弹窗 720px 四区块展示</text>

  <!-- Module 3: 配置 -->
  <rect x="60" y="460" width="460" height="180" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="60" y="460" width="4" height="180" rx="2" fill="#10B981"/>
  <text x="84" y="488" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="bold" fill="#059669">配置模块</text>
  <text x="84" y="518" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#4B5563">分类管理 — CRUD/状态/排序</text>
  <text x="84" y="544" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#4B5563">校区管理 — 校区+面交地点双层</text>
  <text x="84" y="570" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#4B5563">Banner/公告/员工管理</text>
  <rect x="84" y="596" width="180" height="26" rx="13" fill="#ECFDF5"/>
  <text x="174" y="614" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#059669">完成度 99%</text>

  <!-- Right 60%: Data dashboard -->
  <!-- KPI Cards row -->
  <!-- Card 1: 用户 -->
  <rect x="550" y="110" width="330" height="130" rx="12" fill="#DBEAFE"/>
  <use data-icon="tabler-filled/users" x="570" y="128" width="28" height="28" fill="#3B82F6"/>
  <text x="606" y="148" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">用户总数</text>
  <text x="570" y="190" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1E40AF">5,247</text>
  <text x="840" y="175" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#10B981">12.5%</text>

  <!-- Card 2: 商品 -->
  <rect x="900" y="110" width="330" height="130" rx="12" fill="#D1FAE5"/>
  <use data-icon="tabler-filled/clipboard-list" x="920" y="128" width="28" height="28" fill="#10B981"/>
  <text x="956" y="148" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">商品总数</text>
  <text x="920" y="190" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="36" font-weight="bold" fill="#065F46">1,839</text>
  <text x="1190" y="175" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#10B981">8.3%</text>

  <!-- Card 3: 订单 -->
  <rect x="550" y="260" width="330" height="130" rx="12" fill="#FED7AA"/>
  <use data-icon="tabler-filled/clipboard-check" x="570" y="278" width="28" height="28" fill="#F59E0B"/>
  <text x="606" y="298" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">订单总数</text>
  <text x="570" y="340" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="36" font-weight="bold" fill="#B45309">892</text>
  <text x="840" y="325" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#10B981">15.7%</text>

  <!-- Card 4: 评价 -->
  <rect x="900" y="260" width="330" height="130" rx="12" fill="#E9D5FF"/>
  <use data-icon="tabler-filled/star" x="920" y="278" width="28" height="28" fill="#8B5CF6"/>
  <text x="956" y="298" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">评价总数</text>
  <text x="920" y="340" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="36" font-weight="bold" fill="#6D28D9">654</text>
  <text x="1190" y="325" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#10B981">6.2%</text>

  <!-- Chart placeholder: 7-day trend -->
  <rect x="550" y="410" width="680" height="130" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="570" y="435" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F2937">7日数据趋势</text>
  <!-- Mini line chart -->
  <polyline points="600,510 660,500 720,490 780,495 840,478 900,468 960,455" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <polyline points="600,520 660,515 720,508 780,510 840,500 900,492 960,485" fill="none" stroke="#10B981" stroke-width="2"/>
  <polyline points="600,530 660,528 720,525 780,526 840,522 900,518 960,512" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="1000" y="460" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#3B82F6">新增用户</text>
  <text x="1000" y="485" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#10B981">新增商品</text>
  <text x="1000" y="510" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#F59E0B">新增订单</text>
  <!-- X-axis labels -->
  <text x="600" y="548" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#9CA3AF">Day1</text>
  <text x="720" y="548" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#9CA3AF">Day3</text>
  <text x="840" y="548" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#9CA3AF">Day5</text>
  <text x="960" y="548" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#9CA3AF">Day7</text>

  <!-- Image placeholder: admin dashboard -->
  <rect x="550" y="560" width="680" height="80" rx="8" fill="none" stroke="#93C5FD" stroke-dasharray="6,4" stroke-width="1.5"/>
  <text x="890" y="605" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">待插入: admin_dashboard.png (管理后台截图)</text>
</svg>
