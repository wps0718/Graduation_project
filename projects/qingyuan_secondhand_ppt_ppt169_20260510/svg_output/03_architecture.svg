<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="#F9FAFB"/>
  <!-- Title -->
  <rect x="60" y="32" width="8" height="36" rx="4" fill="#3B82F6"/>
  <text x="80" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1F2937">技术选型与系统架构</text>
  <text x="80" y="84" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#6B7280">THREE-TIER ARCHITECTURE WITH SPRING BOOT + UNI-APP + MYSQL</text>

  <!-- Layer 1: 小程序端 (Blue) -->
  <rect x="80" y="110" width="40" height="160" rx="8" fill="#3B82F6"/>
  <text x="100" y="198" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">01</text>
  <rect x="136" y="110" width="1064" height="160" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="668" y="138" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2563EB">小程序端 · 用户界面层</text>
  <!-- Card uni-app -->
  <rect x="156" y="155" width="300" height="95" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <use data-icon="tabler-filled/device-mobile" x="176" y="172" width="32" height="32" fill="#3B82F6"/>
  <text x="220" y="192" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">uni-app + Vue 3</text>
  <text x="220" y="212" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">跨平台编译 · 组件化开发</text>
  <text x="220" y="232" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">Pinia状态管理 · 4个Tab页面</text>
  <!-- Brand icons row -->
  <use data-icon="simple-icons/vuedotjs" x="500" y="170" width="36" height="36" fill="#4FC08D"/>
  <text x="500" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#6B7280">Vue 3</text>
  <rect x="620" y="155" width="280" height="95" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="640" y="178" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F2937">技术特性</text>
  <text x="640" y="200" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#4B5563">HTTP/WS 双协议通讯</text>
  <text x="640" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#4B5563">68个Vue组件 · 15,234行代码</text>
  <text x="640" y="240" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#4B5563">微信小程序 + 管理后台</text>
  <!-- Image placeholder -->
  <rect x="940" y="155" width="240" height="95" rx="8" fill="none" stroke="#93C5FD" stroke-dasharray="6,4" stroke-width="1.5"/>
  <text x="1060" y="200" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#6B7280">待插入: 小程序截图</text>
  <text x="1060" y="218" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#6B7280">miniapp_screenshots.png</text>

  <!-- Arrow down -->
  <line x1="640" y1="278" x2="640" y2="310" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowDown)"/>
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect x="590" y="282" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="640" y="299" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3B82F6">REST / WS</text>

  <!-- Layer 2: 后端服务 (Green) -->
  <rect x="80" y="318" width="40" height="160" rx="8" fill="#10B981"/>
  <text x="100" y="406" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">02</text>
  <rect x="136" y="318" width="1064" height="160" rx="12" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="668" y="346" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="bold" fill="#059669">后端服务 · 业务逻辑层</text>
  <!-- Card Spring Boot -->
  <rect x="156" y="365" width="300" height="95" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <use data-icon="tabler-filled/server" x="176" y="382" width="32" height="32" fill="#10B981"/>
  <text x="220" y="402" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">Spring Boot 3.3.7</text>
  <text x="220" y="422" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">MyBatis-Plus 3.5.7</text>
  <text x="220" y="442" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">Java 17 · Maven构建</text>
  <!-- Brand icons row -->
  <use data-icon="simple-icons/springboot" x="500" y="378" width="36" height="36" fill="#6DB33F"/>
  <text x="500" y="428" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#6B7280">Spring</text>
  <rect x="620" y="365" width="280" height="95" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="640" y="388" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F2937">核心能力</text>
  <text x="640" y="410" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#4B5563">22个Controller · 42个API接口</text>
  <text x="640" y="430" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#4B5563">WebSocket IM · 7个定时任务</text>
  <text x="640" y="450" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#4B5563">JWT拦截器 · 全局异常处理</text>
  <!-- Image placeholder -->
  <rect x="940" y="365" width="240" height="95" rx="8" fill="none" stroke="#6EE7B7" stroke-dasharray="6,4" stroke-width="1.5"/>
  <text x="1060" y="410" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#6B7280">待插入: 管理后台截图</text>
  <text x="1060" y="428" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#6B7280">admin_dashboard.png</text>

  <!-- Arrow down -->
  <line x1="640" y1="486" x2="640" y2="518" stroke="#6B7280" stroke-width="2"/>
  <rect x="580" y="490" width="120" height="24" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="640" y="507" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#10B981">JDBC / Lettuce</text>

  <!-- Layer 3: 数据层 (Orange) -->
  <rect x="80" y="526" width="40" height="120" rx="8" fill="#F59E0B"/>
  <text x="100" y="594" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">03</text>
  <rect x="136" y="526" width="1064" height="120" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="668" y="554" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="bold" fill="#B45309">数据层 · 持久化与缓存</text>
  <!-- MySQL card -->
  <rect x="156" y="570" width="380" height="60" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <use data-icon="simple-icons/mysql" x="176" y="582" width="32" height="32" fill="#4479A1"/>
  <text x="220" y="600" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">MySQL 5.7</text>
  <text x="220" y="620" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">22张业务表 · 286字段 · 45个索引</text>
  <!-- Redis card -->
  <rect x="580" y="570" width="380" height="60" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <use data-icon="simple-icons/redis" x="600" y="582" width="32" height="32" fill="#DC382D"/>
  <text x="644" y="600" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">Redis 6.0</text>
  <text x="644" y="620" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">多级缓存 · 命中率87.3% · 128MB</text>

  <!-- Tech tags at bottom -->
  <text x="80" y="675" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F2937">技术亮点</text>
  <!-- Tag 1 -->
  <rect x="80" y="688" width="160" height="28" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
  <use data-icon="tabler-filled/shield-lock" x="90" y="692" width="20" height="20" fill="#3B82F6"/>
  <text x="115" y="708" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1E40AF">JWT认证</text>
  <!-- Tag 2 -->
  <rect x="255" y="688" width="180" height="28" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
  <use data-icon="tabler-filled/message" x="265" y="692" width="20" height="20" fill="#3B82F6"/>
  <text x="290" y="708" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1E40AF">WebSocket通讯</text>
  <!-- Tag 3 -->
  <rect x="450" y="688" width="160" height="28" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1"/>
  <use data-icon="tabler-filled/bolt" x="460" y="692" width="20" height="20" fill="#10B981"/>
  <text x="485" y="708" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#065F46">缓存优化</text>
  <!-- Tag 4 -->
  <rect x="625" y="688" width="160" height="28" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
  <use data-icon="tabler-filled/clock" x="635" y="692" width="20" height="20" fill="#F59E0B"/>
  <text x="660" y="708" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#92400E">定时任务</text>
  <!-- Tag 5 -->
  <rect x="800" y="688" width="160" height="28" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <use data-icon="tabler-filled/lock" x="810" y="692" width="20" height="20" fill="#EF4444"/>
  <text x="835" y="708" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#991B1B">分布式锁</text>
  <!-- Tag 6 -->
  <rect x="975" y="688" width="160" height="28" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1"/>
  <use data-icon="tabler-filled/key" x="985" y="692" width="20" height="20" fill="#8B5CF6"/>
  <text x="1010" y="708" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#5B21B6">密码加密</text>
</svg>
