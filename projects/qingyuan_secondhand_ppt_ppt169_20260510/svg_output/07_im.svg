<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#1E293B"/>
  <!-- Title -->
  <rect x="60" y="32" width="8" height="36" rx="4" fill="#3B82F6"/>
  <text x="80" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#F1F5F9">自建WebSocket即时通讯方案</text>
  <text x="80" y="84" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#94A3B8">REAL-TIME COMMUNICATION SYSTEM</text>

  <!-- Architecture flow - horizontal -->
  <rect x="60" y="110" width="1160" height="140" rx="12" fill="#334155"/>
  <text x="160" y="138" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#94A3B8">客户端</text>
  <rect x="110" y="148" width="100" height="60" rx="8" fill="#3B82F6"/>
  <text x="160" y="182" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">WebSocket</text>
  <text x="160" y="198" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#DBEAFE">Client</text>
  <!-- Arrow -->
  <line x1="220" y1="178" x2="350" y2="178" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <defs><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#60A5FA"/></marker></defs>
  <text x="285" y="170" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#60A5FA">ws://host/ws</text>

  <!-- Server -->
  <text x="430" y="138" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#94A3B8">服务端</text>
  <rect x="360" y="148" width="140" height="60" rx="8" fill="#10B981"/>
  <text x="430" y="178" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">WebSocket</text>
  <text x="430" y="194" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#D1FAE5">Server</text>

  <!-- Arrow to dispatcher -->
  <line x1="510" y1="178" x2="620" y2="178" stroke="#60A5FA" stroke-width="2"/>
  <!-- Dispatcher -->
  <rect x="630" y="155" width="100" height="46" rx="8" fill="#8B5CF6"/>
  <text x="680" y="182" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">分发器</text>

  <!-- Arrow to handlers -->
  <line x1="740" y1="165" x2="830" y2="148" stroke="#60A5FA" stroke-width="1.5"/>
  <line x1="740" y1="178" x2="830" y2="178" stroke="#60A5FA" stroke-width="1.5"/>
  <line x1="740" y1="191" x2="830" y2="208" stroke="#60A5FA" stroke-width="1.5"/>

  <!-- Handlers -->
  <rect x="840" y="132" width="140" height="30" rx="6" fill="#334155" stroke="#3B82F6" stroke-width="1"/>
  <text x="910" y="152" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11" fill="#93C5FD">ChatHandler</text>
  <rect x="840" y="170" width="140" height="30" rx="6" fill="#334155" stroke="#10B981" stroke-width="1"/>
  <text x="910" y="190" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11" fill="#6EE7B7">ReadHandler</text>
  <rect x="840" y="208" width="140" height="30" rx="6" fill="#334155" stroke="#F59E0B" stroke-width="1"/>
  <text x="910" y="228" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11" fill="#FCD34D">PingHandler</text>

  <!-- 4 Feature cards 2x2 -->
  <!-- Card 1: 握手鉴权 -->
  <rect x="60" y="270" width="560" height="190" rx="12" fill="#334155"/>
  <use data-icon="tabler-filled/shield-lock" x="84" y="292" width="32" height="32" fill="#3B82F6"/>
  <text x="128" y="314" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="bold" fill="#F1F5F9">握手鉴权</text>
  <text x="84" y="348" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#CBD5E1">ChatHandshakeInterceptor 验证JWT Token</text>
  <text x="84" y="374" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#94A3B8">URL参数token解析 → JwtUtil验证</text>
  <text x="84" y="398" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#94A3B8">userId存入Attributes → 验证失败返回403</text>
  <text x="84" y="430" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#94A3B8">封号用户拒绝连接 · Token过期自动断开</text>

  <!-- Card 2: 消息持久化 -->
  <rect x="660" y="270" width="560" height="190" rx="12" fill="#334155"/>
  <use data-icon="tabler-filled/database" x="684" y="292" width="32" height="32" fill="#10B981"/>
  <text x="728" y="314" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="bold" fill="#F1F5F9">消息持久化</text>
  <text x="684" y="348" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#CBD5E1">chat_message表存储全部消息</text>
  <text x="684" y="374" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#94A3B8">session_key + sender/receiver + msg_type</text>
  <text x="684" y="398" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#94A3B8">分页每页20条 · 最近50条热数据缓存</text>
  <text x="684" y="430" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#94A3B8">当前: 12,345条约8.5MB · 支持无限回溯</text>

  <!-- Card 3: 心跳保活 -->
  <rect x="60" y="480" width="560" height="190" rx="12" fill="#334155"/>
  <use data-icon="tabler-filled/bolt" x="84" y="502" width="32" height="32" fill="#EF4444"/>
  <text x="128" y="524" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="bold" fill="#F1F5F9">心跳保活</text>
  <text x="84" y="558" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#CBD5E1">30秒PING/PONG · 60秒TTL</text>
  <text x="84" y="584" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#94A3B8">Redis Key: im:heartbeat:{userId}</text>
  <text x="84" y="608" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#94A3B8">WebSocketHeartbeatTask 每30秒扫描</text>
  <text x="84" y="640" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#94A3B8">超时强制断开 + 清理SessionManager</text>

  <!-- Card 4: 离线消息 -->
  <rect x="660" y="480" width="560" height="190" rx="12" fill="#334155"/>
  <use data-icon="tabler-filled/bell" x="684" y="502" width="32" height="32" fill="#F59E0B"/>
  <text x="728" y="524" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="bold" fill="#F1F5F9">离线消息</text>
  <text x="684" y="558" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#CBD5E1">接收方不在线 → 存储+站内通知</text>
  <text x="684" y="584" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#94A3B8">Redis未读数+1 · 上线后自动拉取</text>
  <text x="684" y="608" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#94A3B8">会话级 + 全局级未读管理</text>
  <text x="684" y="640" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#94A3B8">单会话最多缓存500条未读</text>

  <!-- Chat interface placeholder -->
  <rect x="60" y="680" width="560" height="30" rx="6" fill="none" stroke="#475569" stroke-dasharray="6,4" stroke-width="1"/>
  <text x="340" y="700" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#64748B">待插入: chat_interface.png (IM聊天界面)</text>

  <!-- Performance bar -->
  <rect x="660" y="680" width="560" height="30" rx="8" fill="#334155"/>
  <text x="740" y="700" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#F1F5F9">并发 <tspan font-weight="bold" fill="#3B82F6">500+</tspan></text>
  <text x="940" y="700" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#F1F5F9">延迟 <tspan font-weight="bold" fill="#10B981">&lt;50ms</tspan></text>
  <text x="1120" y="700" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#F1F5F9">成功率 <tspan font-weight="bold" fill="#F59E0B">99.2%</tspan></text>
</svg>
