  <text x="936" y="441" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="bold" fill="#DC2626">80%测试覆盖</text>
  <text x="936" y="464" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#6B7280">123用例100%通过</text>

