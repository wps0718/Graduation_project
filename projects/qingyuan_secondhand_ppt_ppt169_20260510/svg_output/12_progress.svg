  <text x="640" y="620" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#9CA3AF">建议: 3-4张小程序核心页面截图拼图（首页、商品详情、订单页、个人中心）</text>
