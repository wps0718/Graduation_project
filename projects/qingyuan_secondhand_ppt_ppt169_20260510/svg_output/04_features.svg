<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Title -->
  <rect x="60" y="32" width="8" height="36" rx="4" fill="#3B82F6"/>
  <text x="80" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1F2937">用户端核心功能</text>
  <text x="80" y="84" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#6B7280">USER CORE FEATURES — 9大模块 42个API接口</text>

  <!-- 3x3 Grid of feature cards -->
  <!-- Row 1 -->
  <!-- Card 1: 微信登录 -->
  <rect x="60" y="110" width="370" height="170" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <use data-icon="tabler-filled/login" x="80" y="128" width="36" height="36" fill="#3B82F6"/>
