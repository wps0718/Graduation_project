  <text x="525" y="148" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2937">校园认证</text>
  <rect x="735" y="125" width="70" height="24" rx="12" fill="#D1FAE5"/>
  <text x="770" y="142" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#065F46">已完成</text>
