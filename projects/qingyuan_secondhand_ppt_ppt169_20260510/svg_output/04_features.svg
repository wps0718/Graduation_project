  <text x="870" y="572" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">11类通知（交易/系统/审核）</text>
  <text x="870" y="594" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">全部已读/分类已读</text>
  <text x="870" y="616" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">未读数实时更新</text>
