  <text x="475" y="594" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">唯一索引防重复</text>
  <text x="475" y="616" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#4B5563">关注状态30分钟缓存</text>
