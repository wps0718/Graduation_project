  <rect x="340" y="125" width="70" height="24" rx="12" fill="#D1FAE5"/>
  <text x="375" y="142" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#065F46">已完成</text>
  <line x1="80" y1="170" x2="410" y2="170" stroke="#F3F4F6" stroke-width="1"/>
