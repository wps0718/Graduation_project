  <rect x="80" y="262" width="520" height="95" rx="8" fill="#ECFDF5"/>
  <text x="100" y="287" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="bold" fill="#065F46">缓存优化</text>
  <text x="100" y="309" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#4B5563">Redis多级缓存 · Cache-Aside模式 · 命中率87%</text>
  <text x="100" y="329" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#4B5563">防穿透/防雪崩/主动失效 · TTL随机偏移</text>
