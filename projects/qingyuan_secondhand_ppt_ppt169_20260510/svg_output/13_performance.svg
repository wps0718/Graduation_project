  <!-- Left: Performance optimization -->
  <rect x="60" y="110" width="560" height="550" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="80" y="138" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">性能优化措施</text>

  <!-- Database optimization -->
  <rect x="80" y="155" width="520" height="95" rx="8" fill="#EFF6FF"/>
  <text x="100" y="180" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF">数据库优化</text>
  <text x="100" y="202" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#4B5563">45个组合索引 · 慢查询 &lt; 50ms · 分页查询优化</text>
  <text x="100" y="222" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#4B5563">LambdaQueryWrapper链式查询 · 避免N+1问题</text>
  <text x="100" y="242" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6B7280">平均查询耗时: 8ms</text>

