spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://db:3306/secondhand?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:?请设置 DB_PASSWORD 环境变量}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:}

upload:
  path: /app/uploads/
  url-prefix: /uploads/

jwt:
  secret: ${JWT_SECRET:?请设置 JWT_SECRET 环境变量}

wx:
  mini-app-id: ${WX_APP_ID:}
  mini-app-secret: ${WX_APP_SECRET:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
