server:
  port: ${SERVER_PORT:3576}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# JWT配置
jwt:
  expiration: 86400000  # 24小时
  admin-expiration: 86400000

# 文件上传配置
upload:
  url-prefix: /uploads/

task:
  enabled:
    order-expire: true
    order-auto-confirm: true
    review-auto: true
    review-remind: true
    product-auto-off: true
    user-deactivate: true
    pickup-price-confirm: true
    pickup-overdue: true
    pickup-auto-confirm: true
    dispute-reminder: true

pickup:
  aes-key: default-pickup-aes-key-2026
