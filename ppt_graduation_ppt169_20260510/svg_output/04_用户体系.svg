<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.06" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>
  <!-- Page title -->
  <rect x="60" y="40" width="6" height="32" rx="3" fill="#1565C0"/>
  <text x="80" y="66" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1A1A2E">用户体系</text>
  <!-- Card 1: Multi-login -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="100" width="360" height="560" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <rect x="60" y="100" width="360" height="56" rx="16" fill="#1565C0"/>
  <rect x="60" y="140" width="360" height="16" fill="#1565C0"/>
  <text x="240" y="136" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">多方式登录</text>
  <use data-icon="tabler-filled/user" x="204" y="175" width="48" height="48" fill="#1565C0"/>
  <text x="240" y="255" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A1A2E">三种登录方式</text>
  <!-- Login methods -->
  <rect x="90" y="275" width="300" height="45" rx="8" fill="#EFF6FF"/>
  <text x="240" y="304" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1565C0">微信一键登录</text>
  <rect x="90" y="330" width="300" height="45" rx="8" fill="#EFF6FF"/>
  <text x="240" y="359" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1565C0">手机号 + 密码登录</text>
  <rect x="90" y="385" width="300" height="45" rx="8" fill="#EFF6FF"/>
  <text x="240" y="414" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1565C0">短信验证登录</text>
  <!-- JWT note -->
  <rect x="90" y="455" width="300" height="60" rx="8" fill="#F5F7FA"/>
  <text x="240" y="480" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">JWT Token 认证</text>
  <text x="240" y="502" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">24 小时有效期，拦截器验证</text>
  <!-- Lock info -->
  <rect x="90" y="535" width="300" height="40" rx="8" fill="#FFF3E0"/>
  <text x="240" y="562" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#FF6F00">登录失败 5 次锁定 15 分钟（Redis 计数）</text>
  <!-- Card 2: Campus Auth -->
  <g filter="url(#cardShadow)">
    <rect x="460" y="100" width="360" height="560" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <rect x="460" y="100" width="360" height="56" rx="16" fill="#0D47A1"/>
  <rect x="460" y="140" width="360" height="16" fill="#0D47A1"/>
  <text x="640" y="136" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">校园认证</text>
  <use data-icon="tabler-filled/check" x="612" y="175" width="48" height="48" fill="#0D47A1"/>
  <text x="640" y="255" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A1A2E">认证流程</text>
  <!-- Auth steps -->
  <rect x="490" y="275" width="300" height="45" rx="8" fill="#E3F2FD"/>
  <text x="640" y="304" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#0D47A1">填写学院 / 学号 / 班级</text>
  <rect x="490" y="330" width="300" height="45" rx="8" fill="#E3F2FD"/>
  <text x="640" y="359" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#0D47A1">上传一卡通 / 教务截图</text>
  <rect x="490" y="385" width="300" height="45" rx="8" fill="#E3F2FD"/>
  <text x="640" y="414" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#0D47A1">后台人工审核</text>
  <!-- Auth features -->
  <rect x="490" y="455" width="300" height="60" rx="8" fill="#F5F7FA"/>
  <text x="640" y="480" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">认证历史全轨迹回溯</text>
  <text x="640" y="502" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">修改资料可重新提交</text>
  <rect x="490" y="535" width="300" height="40" rx="8" fill="#E8F5E9"/>
  <text x="640" y="562" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#2E7D32">内容对比 + 多版本审核</text>
  <!-- Card 3: Security -->
  <g filter="url(#cardShadow)">
    <rect x="860" y="100" width="360" height="560" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <rect x="860" y="100" width="360" height="56" rx="16" fill="#FF6F00"/>
  <rect x="860" y="140" width="360" height="16" fill="#FF6F00"/>
  <text x="1040" y="136" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">安全机制</text>
  <use data-icon="tabler-filled/shield-lock" x="1012" y="175" width="48" height="48" fill="#FF6F00"/>
  <text x="1040" y="255" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A1A2E">多重安全防护</text>
  <!-- Security items -->
  <rect x="890" y="275" width="300" height="45" rx="8" fill="#FFF3E0"/>
  <text x="1040" y="304" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#FF6F00">BCrypt 密码加密</text>
  <rect x="890" y="330" width="300" height="45" rx="8" fill="#FFF3E0"/>
  <text x="1040" y="359" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#FF6F00">Redis 登录失败锁定</text>
  <rect x="890" y="385" width="300" height="45" rx="8" fill="#FFF3E0"/>
  <text x="1040" y="414" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#FF6F00">手机号脱敏 138****8888</text>
  <rect x="890" y="455" width="300" height="40" rx="8" fill="#F5F7FA"/>
  <text x="1040" y="482" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">SQL 注入防护 — 全部 #{} 绑定</text>
  <rect x="890" y="505" width="300" height="40" rx="8" fill="#F5F7FA"/>
  <text x="1040" y="532" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">XSS 防护 — 前后端双重校验</text>
  <rect x="890" y="555" width="300" height="40" rx="8" fill="#F5F7FA"/>
  <text x="1040" y="582" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">越权防护 — 用户 ID 隔离校验</text>
  <!-- Page number -->
  <text x="1240" y="700" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#9E9E9E">04 / 10</text>
</svg>
