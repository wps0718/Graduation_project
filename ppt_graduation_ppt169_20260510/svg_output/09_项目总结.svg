<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.06" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>
  <!-- Page title -->
  <rect x="60" y="40" width="6" height="32" rx="3" fill="#1565C0"/>
  <text x="80" y="66" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1A1A2E">项目总结与成果</text>
  <!-- KPI Cards - 2x2 layout -->
  <!-- Card 1: Backend -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="100" width="560" height="230" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <rect x="76" y="120" width="6" height="70" rx="3" fill="#1565C0"/>
  <text x="100" y="148" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#5A5A7A">后端服务</text>
  <text x="100" y="175" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#9E9E9E">Spring Boot 3.3.7</text>
  <text x="100" y="260" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="bold" fill="#1565C0">98</text>
  <text x="260" y="260" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold" fill="#9E9E9E">%</text>
  <rect x="100" y="285" width="22" height="22" rx="11" fill="#E8F5E9"/>
  <use data-icon="tabler-filled/check" x="102" y="287" width="18" height="18" fill="#2E7D32"/>
  <text x="132" y="303" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#2E7D32">核心业务 API 全部完成</text>
  <!-- Card 2: Admin -->
  <g filter="url(#cardShadow)">
    <rect x="660" y="100" width="560" height="230" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <rect x="676" y="120" width="6" height="70" rx="3" fill="#2E7D32"/>
  <text x="700" y="148" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#5A5A7A">管理后台</text>
  <text x="700" y="175" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#9E9E9E">Vue 3 + Element Plus</text>
  <text x="700" y="260" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="bold" fill="#2E7D32">99</text>
  <text x="860" y="260" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold" fill="#9E9E9E">%</text>
  <rect x="700" y="285" width="22" height="22" rx="11" fill="#E8F5E9"/>
  <use data-icon="tabler-filled/check" x="702" y="287" width="18" height="18" fill="#2E7D32"/>
  <text x="732" y="303" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#2E7D32">12 个管理页面全部完成</text>
  <!-- Card 3: Mini App -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="360" width="560" height="230" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <rect x="76" y="380" width="6" height="70" rx="3" fill="#FF6F00"/>
  <text x="100" y="408" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#5A5A7A">微信小程序</text>
  <text x="100" y="435" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#9E9E9E">uni-app + Vue 3</text>
  <text x="100" y="520" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="bold" fill="#FF6F00">96</text>
  <text x="260" y="520" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold" fill="#9E9E9E">%</text>
  <rect x="100" y="545" width="22" height="22" rx="11" fill="#E8F5E9"/>
  <use data-icon="tabler-filled/check" x="102" y="547" width="18" height="18" fill="#2E7D32"/>
  <text x="132" y="563" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#2E7D32">核心业务流程全部完成</text>
  <!-- Card 4: Features -->
  <g filter="url(#cardShadow)">
    <rect x="660" y="360" width="560" height="230" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <rect x="676" y="380" width="6" height="70" rx="3" fill="#0D47A1"/>
  <text x="700" y="408" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#5A5A7A">核心功能</text>
  <text x="700" y="435" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#9E9E9E">全栈完整交付</text>
  <text x="700" y="520" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="bold" fill="#0D47A1">20</text>
  <text x="845" y="520" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold" fill="#9E9E9E">+ 项</text>
  <rect x="700" y="545" width="22" height="22" rx="11" fill="#E8F5E9"/>
  <use data-icon="tabler-filled/check" x="702" y="547" width="18" height="18" fill="#2E7D32"/>
  <text x="732" y="563" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#2E7D32">登录/认证/商品/IM/订单/评价</text>
  <!-- Bottom feature list -->
  <line x1="60" y1="610" x2="1220" y2="610" stroke="#E0E0E0" stroke-width="1"/>
  <text x="640" y="645" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5A5A7A">登录注册  |  校园认证  |  商品管理  |  IM 通讯  |  订单交易  |  评价系统  |  举报处理  |  后台管理</text>
  <text x="640" y="675" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5A5A7A">WebSocket 自建 IM  |  Redis 分布式锁  |  定时任务  |  多级缓存  |  JWT 认证  |  数据统计</text>
  <!-- Page number -->
  <text x="1240" y="700" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#9E9E9E">09 / 10</text>
</svg>
