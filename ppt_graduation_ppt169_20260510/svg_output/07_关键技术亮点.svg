<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.06" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>
  <!-- Page title -->
  <rect x="60" y="40" width="6" height="32" rx="3" fill="#1565C0"/>
  <text x="80" y="66" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1A1A2E">关键技术亮点</text>
  <!-- Card 1: Distributed Lock -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="100" width="360" height="560" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <rect x="60" y="100" width="360" height="56" rx="16" fill="#1565C0"/>
  <rect x="60" y="140" width="360" height="16" fill="#1565C0"/>
  <text x="240" y="136" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Redis 分布式锁</text>
  <use data-icon="tabler-filled/shield-lock" x="204" y="175" width="48" height="48" fill="#1565C0"/>
  <!-- Lock flow -->
  <text x="240" y="255" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A1A2E">订单创建防并发</text>
  <rect x="90" y="275" width="300" height="40" rx="8" fill="#EFF6FF"/>
  <text x="240" y="301" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1565C0">Key: product:lock:{productId}</text>
  <rect x="90" y="325" width="300" height="40" rx="8" fill="#EFF6FF"/>
  <text x="240" y="351" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1565C0">TTL: 30 秒自动释放</text>
  <rect x="90" y="375" width="300" height="40" rx="8" fill="#EFF6FF"/>
  <text x="240" y="401" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1565C0">同一商品同时只有一个有效订单</text>
  <!-- Benefit -->
  <rect x="90" y="440" width="300" height="50" rx="8" fill="#E8F5E9"/>
  <text x="240" y="462" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">解决并发下单</text>
  <text x="240" y="482" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">防止超卖问题</text>
  <!-- Card 2: Scheduled Tasks -->
  <g filter="url(#cardShadow)">
    <rect x="460" y="100" width="360" height="560" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <rect x="460" y="100" width="360" height="56" rx="16" fill="#FF6F00"/>
  <rect x="460" y="140" width="360" height="16" fill="#FF6F00"/>
  <text x="640" y="136" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">定时任务体系</text>
  <use data-icon="tabler-filled/clock-hour-1" x="612" y="175" width="48" height="48" fill="#FF6F00"/>
  <text x="640" y="255" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A1A2E">6 个 @Scheduled 任务</text>
  <!-- Task list -->
  <rect x="490" y="275" width="300" height="35" rx="6" fill="#FFF3E0"/>
  <text x="640" y="299" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#FF6F00">订单超时取消 — 每 5 分钟</text>
  <rect x="490" y="318" width="300" height="35" rx="6" fill="#FFF3E0"/>
  <text x="640" y="342" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#FF6F00">订单自动确认 — 每天凌晨 2:00</text>
  <rect x="490" y="361" width="300" height="35" rx="6" fill="#FFF3E0"/>
  <text x="640" y="385" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#FF6F00">自动好评 — 每天凌晨 3:00</text>
  <rect x="490" y="404" width="300" height="35" rx="6" fill="#FFF3E0"/>
  <text x="640" y="428" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#FF6F00">评价提醒 — 每天上午 10:00</text>
  <rect x="490" y="447" width="300" height="35" rx="6" fill="#FFF3E0"/>
  <text x="640" y="471" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#FF6F00">商品自动下架 — 每天凌晨 4:00</text>
  <rect x="490" y="490" width="300" height="35" rx="6" fill="#FFF3E0"/>
  <text x="640" y="514" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#FF6F00">账号注销清理 — 每天凌晨 5:00</text>
  <!-- Benefit -->
  <rect x="490" y="540" width="300" height="50" rx="8" fill="#E8F5E9"/>
  <text x="640" y="562" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">application.yml 配置开关</text>
  <text x="640" y="582" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">无需修改代码即可控制</text>
  <!-- Card 3: Caching Strategy -->
  <g filter="url(#cardShadow)">
    <rect x="860" y="100" width="360" height="560" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <rect x="860" y="100" width="360" height="56" rx="16" fill="#0D47A1"/>
  <rect x="860" y="140" width="360" height="16" fill="#0D47A1"/>
  <text x="1040" y="136" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">多级缓存策略</text>
  <use data-icon="tabler-filled/database" x="1012" y="175" width="48" height="48" fill="#0D47A1"/>
  <text x="1040" y="255" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A1A2E">Cache-Aside 模式</text>
  <!-- Strategy 1 -->
  <rect x="890" y="275" width="300" height="55" rx="8" fill="#E3F2FD"/>
  <text x="1040" y="296" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D47A1">防穿透 — 缓存空值</text>
  <text x="1040" y="318" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#5A5A7A">null 值缓存 5 分钟，TTL 缩短</text>
  <!-- Strategy 2 -->
  <rect x="890" y="345" width="300" height="55" rx="8" fill="#E3F2FD"/>
  <text x="1040" y="366" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D47A1">防雪崩 — 随机 TTL</text>
  <text x="1040" y="388" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#5A5A7A">TTL + random(60~300) 秒偏移</text>
  <!-- Strategy 3 -->
  <rect x="890" y="415" width="300" height="55" rx="8" fill="#E3F2FD"/>
  <text x="1040" y="436" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D47A1">主动失效 — 更新即删除</text>
  <text x="1040" y="458" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#5A5A7A">数据变更时同步清除缓存</text>
  <!-- Cache count -->
  <rect x="890" y="495" width="300" height="60" rx="8" fill="#F5F7FA"/>
  <text x="1040" y="520" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A1A2E">20+ Redis 缓存 Key</text>
  <text x="1040" y="545" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#5A5A7A">覆盖用户/商品/分类/会话等</text>
  <!-- Page number -->
  <text x="1240" y="700" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#9E9E9E">07 / 10</text>
</svg>
