<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.06" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>
  <!-- Page title -->
  <rect x="60" y="40" width="6" height="32" rx="3" fill="#1565C0"/>
  <text x="80" y="66" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1A1A2E">技术架构</text>
  <!-- Layer 1: Frontend Layer -->
  <rect x="60" y="100" width="40" height="160" rx="8" fill="#1565C0"/>
  <text x="80" y="188" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">01</text>
  <rect x="116" y="100" width="1104" height="160" rx="12" fill="#EFF6FF" fill-opacity="0.5" stroke="#90CAF9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="668" y="128" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565C0" letter-spacing="1">前端层 — 用户界面与交互</text>
  <!-- Card: Mini Program -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="145" width="330" height="100" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <use data-icon="tabler-filled/device-mobile" x="158" y="165" width="32" height="32" fill="#1565C0"/>
  <text x="200" y="182" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A1A2E">微信小程序</text>
  <text x="200" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#5A5A7A">uni-app + Vue 3 + Pinia</text>
  <text x="200" y="225" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#5A5A7A">四 Tab 布局：首页/发布/消息/我的</text>
  <!-- Card: Admin Panel -->
  <g filter="url(#cardShadow)">
    <rect x="500" y="145" width="330" height="100" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <use data-icon="tabler-filled/chart-pie" x="518" y="165" width="32" height="32" fill="#1565C0"/>
  <text x="560" y="182" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A1A2E">管理后台</text>
  <text x="560" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#5A5A7A">Vue 3 + Vite + Element Plus + ECharts</text>
  <text x="560" y="225" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#5A5A7A">数据概览 / 审核管理 / 配置管理</text>
  <!-- Layer 2: Backend Layer -->
  <rect x="60" y="280" width="40" height="160" rx="8" fill="#0D47A1"/>
  <text x="80" y="368" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">02</text>
  <rect x="116" y="280" width="1104" height="160" rx="12" fill="#E3F2FD" fill-opacity="0.5" stroke="#64B5F6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="668" y="308" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D47A1" letter-spacing="1">后端服务层 — 业务逻辑与接口</text>
  <!-- Card: Spring Boot -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="325" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <use data-icon="tabler-filled/code-circle" x="158" y="345" width="32" height="32" fill="#0D47A1"/>
  <text x="200" y="362" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A1A2E">Spring Boot</text>
  <text x="200" y="382" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#5A5A7A">3.3.7 + Java 17</text>
  <text x="200" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#5A5A7A">22 个 Controller</text>
  <!-- Card: MyBatis-Plus -->
  <g filter="url(#cardShadow)">
    <rect x="380" y="325" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <use data-icon="tabler-filled/database" x="398" y="345" width="32" height="32" fill="#0D47A1"/>
  <text x="440" y="362" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A1A2E">MyBatis-Plus</text>
  <text x="440" y="382" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#5A5A7A">3.5.7 ORM 框架</text>
  <text x="440" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#5A5A7A">Lambda 条件构造器</text>
  <!-- Card: JWT + Redis -->
  <g filter="url(#cardShadow)">
    <rect x="620" y="325" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <use data-icon="tabler-filled/shield-lock" x="638" y="345" width="32" height="32" fill="#0D47A1"/>
  <text x="680" y="362" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A1A2E">JWT + Redis</text>
  <text x="680" y="382" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#5A5A7A">Token 认证 + 缓存</text>
  <text x="680" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#5A5A7A">分布式锁 + 会话管理</text>
  <!-- Card: WebSocket -->
  <g filter="url(#cardShadow)">
    <rect x="860" y="325" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <use data-icon="tabler-filled/messages" x="878" y="345" width="32" height="32" fill="#0D47A1"/>
  <text x="920" y="362" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A1A2E">WebSocket IM</text>
  <text x="920" y="382" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#5A5A7A">自建即时通讯</text>
  <text x="920" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#5A5A7A">心跳保活 + 已读回执</text>
  <!-- Layer 3: Data Layer -->
  <rect x="60" y="460" width="40" height="100" rx="8" fill="#FF6F00"/>
  <text x="80" y="518" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">03</text>
  <rect x="116" y="460" width="1104" height="100" rx="12" fill="#FFF3E0" fill-opacity="0.5" stroke="#FFB74D" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="668" y="488" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF6F00" letter-spacing="1">数据层 — 持久化与缓存</text>
  <!-- MySQL card -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="505" width="330" height="40" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <use data-icon="tabler-filled/database" x="158" y="512" width="26" height="26" fill="#FF6F00"/>
  <text x="194" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A1A2E">MySQL 5.7  —  15+ 数据表，增量更新脚本</text>
  <!-- Redis card -->
  <g filter="url(#cardShadow)">
    <rect x="500" y="505" width="330" height="40" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <use data-icon="tabler-filled/settings" x="518" y="512" width="26" height="26" fill="#FF6F00"/>
  <text x="554" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A1A2E">Redis 6.0+  —  20+ 缓存 Key，TTL 策略</text>
  <!-- Connection arrows (decorative) -->
  <line x1="668" y1="260" x2="668" y2="280" stroke="#90CAF9" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="668" y1="440" x2="668" y2="460" stroke="#FFB74D" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- Page number -->
  <text x="1240" y="700" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#9E9E9E">03 / 10</text>
</svg>
