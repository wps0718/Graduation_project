<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.06" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>
  <!-- Page title -->
  <rect x="60" y="40" width="6" height="32" rx="3" fill="#1565C0"/>
  <text x="80" y="66" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1A1A2E">项目背景与痛点</text>
  <!-- Left column: Pain points -->
  <!-- Pain 1 -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="110" width="550" height="120" rx="12" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <rect x="60" y="110" width="6" height="120" rx="3" fill="#C62828"/>
  <use data-icon="tabler-filled/alert-triangle" x="84" y="138" width="28" height="28" fill="#C62828"/>
  <text x="124" y="154" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A1A2E">痛点一：信息分散</text>
  <text x="124" y="182" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5A5A7A">学生出售闲置物品依赖 QQ 群、微信群，信息零散、易刷屏、难检索</text>
  <!-- Pain 2 -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="250" width="550" height="120" rx="12" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <rect x="60" y="250" width="6" height="120" rx="3" fill="#C62828"/>
  <use data-icon="tabler-filled/alert-triangle" x="84" y="278" width="28" height="28" fill="#C62828"/>
  <text x="124" y="294" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A1A2E">痛点二：信任缺失</text>
  <text x="124" y="322" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5A5A7A">群内交易无信用体系，商品质量和卖家信誉无法保障</text>
  <!-- Pain 3 -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="390" width="550" height="120" rx="12" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <rect x="60" y="390" width="6" height="120" rx="3" fill="#C62828"/>
  <use data-icon="tabler-filled/alert-triangle" x="84" y="418" width="28" height="28" fill="#C62828"/>
  <text x="124" y="434" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A1A2E">痛点三：效率低下</text>
  <text x="124" y="462" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5A5A7A">买卖双方缺乏高效的沟通和交易管理工具</text>
  <!-- Pain 4 -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="530" width="550" height="120" rx="12" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1"/>
  </g>
  <rect x="60" y="530" width="6" height="120" rx="3" fill="#C62828"/>
  <use data-icon="tabler-filled/alert-triangle" x="84" y="558" width="28" height="28" fill="#C62828"/>
  <text x="124" y="574" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A1A2E">痛点四：毕业浪费</text>
  <text x="124" y="602" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5A5A7A">每年毕业季大量物品被丢弃，缺乏集中的处理渠道</text>
  <!-- Right column: Solution summary -->
  <g filter="url(#cardShadow)">
    <rect x="650" y="110" width="570" height="540" rx="16" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5"/>
  </g>
  <rect x="650" y="110" width="570" height="56" rx="16" fill="#1565C0"/>
  <rect x="650" y="150" width="570" height="16" fill="#1565C0"/>
  <text x="935" y="146" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">解决方案</text>
  <!-- Solution content -->
  <text x="690" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1565C0">轻院二手</text>
  <text x="690" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5A5A7A">一款专为广东轻工职业技术大学</text>
  <text x="690" y="265" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5A5A7A">在校学生打造的微信小程序</text>
  <!-- Features list -->
  <use data-icon="tabler-filled/check" x="690" y="305" width="22" height="22" fill="#2E7D32"/>
  <text x="722" y="322" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">商品发布、浏览搜索、即时通讯、面交撮合</text>
  <use data-icon="tabler-filled/check" x="690" y="345" width="22" height="22" fill="#2E7D32"/>
  <text x="722" y="362" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">校园认证体系，构建校内信任环境</text>
  <use data-icon="tabler-filled/check" x="690" y="385" width="22" height="22" fill="#2E7D32"/>
  <text x="722" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">微信小程序 + 管理后台双端架构</text>
  <use data-icon="tabler-filled/check" x="690" y="425" width="22" height="22" fill="#2E7D32"/>
  <text x="722" y="442" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">让闲置物品在校园内高效流转</text>
  <!-- Highlight box -->
  <rect x="690" y="485" width="490" height="60" rx="8" fill="#1565C0" fill-opacity="0.08"/>
  <text x="935" y="512" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565C0">参考闲鱼模式，结合校园特色</text>
  <text x="935" y="535" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565C0">打造一站式校园二手交易平台</text>
  <!-- Page number -->
  <text x="1240" y="700" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#9E9E9E">02 / 10</text>
</svg>
