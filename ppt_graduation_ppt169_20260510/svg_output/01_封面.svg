<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <radialGradient id="bgDecor1" cx="85%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgDecor2" cx="10%" cy="85%" r="30%">
      <stop offset="0%" stop-color="#FF6F00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#coverGrad)"/>
  <rect width="1280" height="720" fill="url(#bgDecor1)"/>
  <rect width="1280" height="720" fill="url(#bgDecor2)"/>
  <!-- Decorative lines -->
  <line x1="0" y1="260" x2="1280" y2="260" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="460" x2="1280" y2="460" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <!-- Accent bar left -->
  <rect x="60" y="280" width="6" height="160" rx="3" fill="#FF6F00"/>
  <!-- Main title -->
  <text x="90" y="340" font-family="Microsoft YaHei, Arial, sans-serif" font-size="60" font-weight="bold" fill="#FFFFFF" letter-spacing="2">轻院二手交易平台</text>
  <!-- Subtitle -->
  <text x="92" y="385" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#FFFFFF" fill-opacity="0.85">校园二手交易微信小程序 — 毕业设计答辩</text>
  <!-- Divider -->
  <line x1="90" y1="420" x2="350" y2="420" stroke="#FF6F00" stroke-width="2"/>
  <!-- Info line -->
  <text x="92" y="455" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.7">广东轻工职业技术大学  |  2026 年 5 月</text>
  <!-- Bottom decorative element -->
  <rect x="1150" y="650" width="80" height="80" rx="40" fill="#FF6F00" fill-opacity="0.15"/>
  <rect x="1080" y="670" width="50" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.05"/>
</svg>
