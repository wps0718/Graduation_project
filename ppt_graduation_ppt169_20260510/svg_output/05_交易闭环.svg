<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#9E9E9E"/>
    </marker>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.06" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>
  <!-- Page title -->
  <rect x="60" y="40" width="6" height="32" rx="3" fill="#1565C0"/>
  <text x="80" y="66" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1A1A2E">交易闭环</text>
  <!-- Arrow connectors between steps -->
  <line x1="215" y1="230" x2="300" y2="230" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="465" y1="230" x2="550" y2="230" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="715" y1="230" x2="800" y2="230" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="965" y1="230" x2="1050" y2="230" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Step 1: Publish -->
  <g filter="url(#cardShadow)">
    <circle cx="165" cy="230" r="38" fill="#1565C0"/>
    <circle cx="165" cy="230" r="32" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4"/>
    <text x="165" y="226" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">01</text>
    <text x="165" y="246" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" fill-opacity="0.8">STEP</text>
  </g>
  <line x1="165" y1="268" x2="165" y2="305" stroke="#1565C0" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5"/>
  <g filter="url(#cardShadow)">
    <rect x="60" y="305" width="210" height="350" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <rect x="60" y="330" width="4" height="36" fill="#1565C0"/>
    <text x="78" y="352" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A1A2E">商品发布</text>
    <use data-icon="tabler-filled/shopping-cart" x="127" y="380" width="36" height="36" fill="#1565C0"/>
    <text x="78" y="445" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">图片上传（最多 9 张）</text>
    <text x="78" y="470" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">商品信息填写</text>
    <text x="78" y="495" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">审核上架</text>
    <rect x="78" y="520" width="175" height="30" rx="6" fill="#EFF6FF"/>
    <text x="165" y="541" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#1565C0">审核队列 → 通知上架</text>
  </g>
  <!-- Step 2: Chat -->
  <g filter="url(#cardShadow)">
    <circle cx="415" cy="230" r="38" fill="#0D47A1"/>
    <circle cx="415" cy="230" r="32" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4"/>
    <text x="415" y="226" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">02</text>
    <text x="415" y="246" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" fill-opacity="0.8">STEP</text>
  </g>
  <line x1="415" y1="268" x2="415" y2="305" stroke="#0D47A1" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5"/>
  <g filter="url(#cardShadow)">
    <rect x="310" y="305" width="210" height="350" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <rect x="310" y="330" width="4" height="36" fill="#0D47A1"/>
    <text x="328" y="352" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A1A2E">IM 沟通</text>
    <use data-icon="tabler-filled/messages" x="377" y="380" width="36" height="36" fill="#0D47A1"/>
    <text x="328" y="445" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">「我想要」发起聊天</text>
    <text x="328" y="470" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">WebSocket 实时消息</text>
    <text x="328" y="495" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">商品卡片自动发送</text>
    <rect x="328" y="520" width="175" height="30" rx="6" fill="#E3F2FD"/>
    <text x="415" y="541" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#0D47A1">协商价格 / 面交地点</text>
  </g>
  <!-- Step 3: Order -->
  <g filter="url(#cardShadow)">
    <circle cx="665" cy="230" r="38" fill="#FF6F00"/>
    <circle cx="665" cy="230" r="32" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4"/>
    <text x="665" y="226" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">03</text>
    <text x="665" y="246" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" fill-opacity="0.8">STEP</text>
  </g>
  <line x1="665" y1="268" x2="665" y2="305" stroke="#FF6F00" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5"/>
  <g filter="url(#cardShadow)">
    <rect x="560" y="305" width="210" height="350" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <rect x="560" y="330" width="4" height="36" fill="#FF6F00"/>
    <text x="578" y="352" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A1A2E">下单交易</text>
    <use data-icon="tabler-filled/shield-lock" x="627" y="380" width="36" height="36" fill="#FF6F00"/>
    <text x="578" y="445" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">Redis 分布式锁防并发</text>
    <text x="578" y="470" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">72 小时超时自动取消</text>
    <text x="578" y="495" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">同一商品一单制</text>
    <rect x="578" y="520" width="175" height="30" rx="6" fill="#FFF3E0"/>
    <text x="665" y="541" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#FF6F00">待接单 → 待面交</text>
  </g>
  <!-- Step 4: Dual Confirm -->
  <g filter="url(#cardShadow)">
    <circle cx="915" cy="230" r="38" fill="#2E7D32"/>
    <circle cx="915" cy="230" r="32" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4"/>
    <text x="915" y="226" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">04</text>
    <text x="915" y="246" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" fill-opacity="0.8">STEP</text>
  </g>
  <line x1="915" y1="268" x2="915" y2="305" stroke="#2E7D32" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5"/>
  <g filter="url(#cardShadow)">
    <rect x="810" y="305" width="210" height="350" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <rect x="810" y="330" width="4" height="36" fill="#2E7D32"/>
    <text x="828" y="352" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A1A2E">双向确认</text>
    <use data-icon="tabler-filled/check" x="877" y="380" width="36" height="36" fill="#2E7D32"/>
    <text x="828" y="445" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">卖家确认已交付</text>
    <text x="828" y="470" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">买家确认收货</text>
    <text x="828" y="495" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">双方均确认 → 已完成</text>
    <rect x="828" y="520" width="175" height="30" rx="6" fill="#E8F5E9"/>
    <text x="915" y="541" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#2E7D32">待面交 → 已完成</text>
  </g>
  <!-- Step 5: Review -->
  <g filter="url(#cardShadow)">
    <circle cx="1115" cy="230" r="38" fill="#9C27B0"/>
    <circle cx="1115" cy="230" r="32" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4"/>
    <text x="1115" y="226" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">05</text>
    <text x="1115" y="246" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" fill-opacity="0.8">STEP</text>
  </g>
  <line x1="1115" y1="268" x2="1115" y2="305" stroke="#9C27B0" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5"/>
  <g filter="url(#cardShadow)">
    <rect x="1010" y="305" width="210" height="350" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <rect x="1010" y="330" width="4" height="36" fill="#9C27B0"/>
    <text x="1028" y="352" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A1A2E">互评体系</text>
    <use data-icon="tabler-filled/star" x="1077" y="380" width="36" height="36" fill="#9C27B0"/>
    <text x="1028" y="445" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">三维度评分</text>
    <text x="1028" y="470" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">7 天未评自动好评</text>
    <text x="1028" y="495" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5A5A7A">综合评分实时计算</text>
    <rect x="1028" y="520" width="175" height="30" rx="6" fill="#F3E5F5"/>
    <text x="1115" y="541" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#9C27B0">已完成 → 已评价</text>
  </g>
  <!-- Page number -->
  <text x="1240" y="700" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#9E9E9E">05 / 10</text>
</svg>
