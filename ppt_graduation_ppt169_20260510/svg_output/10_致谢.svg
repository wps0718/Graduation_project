<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <radialGradient id="bgDecor1" cx="15%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgDecor2" cx="85%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#FF6F00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#coverGrad)"/>
  <rect width="1280" height="720" fill="url(#bgDecor1)"/>
  <rect width="1280" height="720" fill="url(#bgDecor2)"/>
  <!-- Decorative lines -->
  <line x1="0" y1="280" x2="1280" y2="280" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="0" y1="440" x2="1280" y2="440" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
  <!-- Main text -->
  <text x="640" y="320" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF" letter-spacing="4">感谢各位老师的指导与聆听</text>
  <!-- Decorative line -->
  <line x1="490" y1="360" x2="790" y2="360" stroke="#FF6F00" stroke-width="2"/>
  <!-- Project info -->
  <text x="640" y="410" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#FFFFFF" fill-opacity="0.8">轻院二手交易平台 — 校园二手交易微信小程序</text>
  <!-- Person info -->
  <text x="640" y="470" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.7">广东轻工职业技术大学  |  2026 年 5 月</text>
  <!-- Bottom decoration -->
  <rect x="1150" y="650" width="80" height="80" rx="40" fill="#FF6F00" fill-opacity="0.12"/>
  <rect x="50" y="660" width="50" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.04"/>
</svg>
