  <text x="430" y="178" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A1A2E">握手鉴权</text>
  <text x="430" y="198" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#5A5A7A">ChatHandshakeInterceptor</text>
  
  <line x1="520" y1="170" x2="590" y2="170" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowR)" />
  
  <g filter="url(#cardShadow)">
