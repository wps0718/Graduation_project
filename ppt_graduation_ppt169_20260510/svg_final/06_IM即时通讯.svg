  </g>
  <text x="690" y="178" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A1A2E">会话管理</text>
  <text x="690" y="198" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#5A5A7A">WebSocketSessionManager</text>
  
  <line x1="780" y1="170" x2="850" y2="170" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowR)" />
  
  <g filter="url(#cardShadow)">
    <path fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.5" d="M870,130 H1030 A10,10 0 0 1 1040,140 V200 A10,10 0 0 1 1030,210 H870 A10,10 0 0 1 860,200 V140 A10,10 0 0 1 870,130 Z" />
  </g>
  <text x="950" y="170" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0D47A1">消息分发器</text>
  <text x="950" y="195" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#5A5A7A">MessageDispatcher</text>
  
  <line x1="1040" y1="170" x2="1100" y2="170" stroke="#5A5A7A" stroke-width="1.5" marker-end="url(#arrowR)" />
  
  <g filter="url(#cardShadow)">
    <path fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" d="M1118,120 H1232 A8,8 0 0 1 1240,128 V156 A8,8 0 0 1 1232,164 H1118 A8,8 0 0 1 1110,156 V128 A8,8 0 0 1 1118,120 Z" />
  </g>
  <text x="1175" y="148" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1565C0">Chat 聊天</text>
  
  <g filter="url(#cardShadow)">
    <path fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" d="M1118,175 H1232 A8,8 0 0 1 1240,183 V211 A8,8 0 0 1 1232,219 H1118 A8,8 0 0 1 1110,211 V183 A8,8 0 0 1 1118,175 Z" />
  </g>
  <text x="1175" y="203" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2E7D32">Read 已读</text>
  
  <g filter="url(#cardShadow)">
    <path fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" d="M1118,230 H1232 A8,8 0 0 1 1240,238 V266 A8,8 0 0 1 1232,274 H1118 A8,8 0 0 1 1110,266 V238 A8,8 0 0 1 1118,230 Z" />
  </g>
  <text x="1175" y="258" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FF6F00">Ping 心跳</text>
  
  <line x1="1110" y1="310" x2="260" y2="310" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#arrowL)" />
  <text x="685" y="305" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#2E7D32">消息推送 / 已读回执 / PONG</text>
  
  <line x1="60" y1="355" x2="1220" y2="355" stroke="#E0E0E0" stroke-width="1" />
  <text x="640" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A1A2E">核心特性</text>
  
  <text font-size="17" fill="#1A1A2E" font-family="Microsoft YaHei, Arial, sans-serif" x="100" y="435">心跳保活：客户端每 30s 发 PING，服务端回 PONG，60s 超时断线检测</text><text font-size="17" fill="#1A1A2E" font-family="Microsoft YaHei, Arial, sans-serif" x="100" y="470">未读管理：每个会话独立维护未读数，Redis 全局总未读（im:unread:{userId}）</text><text font-size="17" fill="#1A1A2E" font-family="Microsoft YaHei, Arial, sans-serif" x="100" y="505">已读回执：接收方读取消息后推送 READ 帧，发送方收到 READ_ACK 确认</text><text font-size="17" fill="#1A1A2E" font-family="Microsoft YaHei, Arial, sans-serif" x="100" y="540">离线通知：接收方离线时写入站内通知，上线后可在消息中心查看</text><text font-size="17" fill="#1A1A2E" font-family="Microsoft YaHei, Arial, sans-serif" x="100" y="575">业务卡片：商品卡片（「我想要」自动发送）、订单卡片（创建订单后推送）</text><text font-size="17" fill="#1A1A2E" font-family="Microsoft YaHei, Arial, sans-serif" x="100" y="610">踢下线：服务端主动推送 FORCE_OFFLINE 帧（封号场景）</text><text x="1240" y="700" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#9E9E9E">06 / 10</text>
</svg>