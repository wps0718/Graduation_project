  <text x="160" y="198" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#5A5A7A">ws://host:port/ws/chat</text>
  
  <line x1="260" y1="170" x2="330" y2="170" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowR)" />
  <text x="295" y="160" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1565C0">JWT</text>
  
